services:
  wow-vote-poller:
    image: curlimages/curl:8.16.0
    restart: unless-stopped
    environment:
      SYNC_TOKEN: ${WOW_VOTE_SYNC_TOKEN:?Set WOW_VOTE_SYNC_TOKEN in Bitwarden Secrets Manager}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        echo "Starting WoW vote polling"
        while :; do
          status=$$(curl --silent --show-error --max-time 180 --output /dev/null \
            --write-out '%{http_code}' --request POST \
            --config - \
            'https://wow-faction-vote-opjyooopzq-ez.a.run.app/api/discord/sync' \
            <<EOF
        header = "X-Sync-Token: $${SYNC_TOKEN}"
        EOF
          ) || status=000
          case "$$status" in
            200) sleep 20 ;;
            409) sleep 10 ;;
            429) echo "Discord rate limit; retrying in 60s" >&2; sleep 60 ;;
            *) echo "Vote sync returned HTTP $$status; retrying in 30s" >&2; sleep 30 ;;
          esac
        done
